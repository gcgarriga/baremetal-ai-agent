[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baremetal-agent"
version = "0.1.0"
description = "A tiny framework-free agent framework with raw LLM API calls, tool use, trajectories, replay, streaming, and evals."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Gemma Garriga" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "httpx",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.scripts]
baremetal-agent = "baremetal_agent.cli:main"

[project.urls]
Repository = "https://github.com/gcgarriga/baremetal-ai-agent"
Documentation = "https://github.com/gcgarriga/baremetal-ai-agent#readme"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E: pycodestyle errors, F: pyflakes, I: isort, UP: pyupgrade
# B: bugbear (catches real bugs), SIM: simplify

[tool.pytest.ini_options]
testpaths = ["tests"]
